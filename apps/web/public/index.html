<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>培训-客服系统demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --border: #e5e7eb;
      --ok: #059669;
      --ok-soft: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px 0;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 8px 16px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    main {
      padding: 16px 24px 32px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-val { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
    }
    .field small { color: var(--muted); font-size: 11px; }
    .chat-box {
      height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #fafafa;
      margin-bottom: 12px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.customer { background: var(--primary); color: #fff; margin-left: auto; }
    .msg.assistant { background: #fff; border: 1px solid var(--border); }
    .msg.human_agent { background: var(--ok-soft); border: 1px solid #a7f3d0; }
    .msg.system { background: #fffbeb; border: 1px solid #fde68a; font-size: 13px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button {
      font-size: 13px;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    input[type="text"] { flex: 1; min-width: 140px; }
    input[type="range"] { padding: 0; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      cursor: pointer;
      font-weight: 500;
    }
    button.ghost { background: #fff; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .cm-cell { text-align: center; font-weight: 600; }
    .cm-diag { background: var(--primary-soft); color: var(--primary); }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
    .bar-label { width: 96px; }
    .bar-track { flex: 1; height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); }
    .bar-fill.ok { background: var(--ok); }
    .best-row { background: var(--ok-soft); }
  </style>
</head>
<body>
  <header>
    <h1>培训-客服系统demo</h1>
    <span class="badge" id="modeBadge">加载中...</span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat', this)">1. 客户问答端</button>
    <button class="tab-btn" onclick="switchTab('data', this)">2. 样本均衡与训练工作台</button>
    <button class="tab-btn" onclick="switchTab('handoff', this)">3. 人工客服接管台</button>
  </div>

  <main>
    <!-- 1. 客户问答端 -->
    <section id="tab-chat" class="panel active">
      <div class="card">
        <div class="row" style="margin-bottom: 10px;">
          <span style="font-size:13px;color:var(--muted);">快捷测试：</span>
          <button class="ghost" onclick="quickAsk('请问优惠券过期了还能补发吗？')">优惠券补发</button>
          <button class="ghost" onclick="quickAsk('我的快递三天没更新物流信息了怎么办？')">物流催件</button>
          <button class="ghost" onclick="quickAsk('我想申请七天无理由退货怎么操作？')">申请退货</button>
          <button class="ghost" onclick="quickAsk('我要投诉你们的服务，请立即转人工！')">投诉转人工</button>
          <button class="ghost" onclick="newSession()">新会话</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="row">
          <input type="text" id="chatInput" placeholder="请输入客户问题..." onkeydown="if(event.key==='Enter')sendMessage()" />
          <button class="primary" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </section>

    <!-- 2. 样本均衡与训练工作台 -->
    <section id="tab-data" class="panel">
      <div class="card">
        <h3 style="margin-top:0;">一、语料库与外部数据导入</h3>
        <div class="row" style="justify-content: space-between;">
          <div id="corpusSummary" class="meta" style="margin:0;">正在加载语料统计...</div>
          <div class="row">
            <input type="file" id="corpusFileInput" accept=".jsonl,.csv,.txt" />
            <button class="ghost" onclick="uploadCorpus()">导入语料并叠加</button>
          </div>
        </div>
        <div id="uploadMsg" class="meta"></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">二、数据均衡与训练超参数设置</h3>
        <div class="form-grid">
          <label class="field">
            <span>实验版本号</span>
            <input type="text" id="verInput" placeholder="留空自动递增 (如 v1.1.0)" />
            <small>用于追踪每次迭代与对比</small>
          </label>
          <label class="field">
            <span>随机种子 (Seed)</span>
            <input type="number" id="seedInput" value="42" />
            <small>固定 Seed 确保采样切分 100% 可复现</small>
          </label>
          <label class="field">
            <span>样本均衡策略</span>
            <select id="strategySelect">
              <option value="undersample">undersample (1:1:1:1 下采样)</option>
              <option value="oversample">oversample (少数类过采样补齐)</option>
              <option value="stratified">stratified (保持原始不均衡比例)</option>
            </select>
            <small>防止多数类挤压投诉类识别率</small>
          </label>
          <label class="field">
            <span>切分比例 (Train / Val / Test)</span>
            <select id="splitPresetSelect">
              <option value="0.8,0.1,0.1">80% 训练 / 10% 验证 / 10% 测试</option>
              <option value="0.7,0.15,0.15">70% 训练 / 15% 验证 / 15% 测试</option>
              <option value="0.6,0.2,0.2">60% 训练 / 20% 验证 / 20% 测试</option>
            </select>
            <small>按类别内部独立切分防泄露</small>
          </label>
          <label class="field">
            <span>分类器算法</span>
            <select id="classifierSelect" onchange="toggleNbParams()">
              <option value="naive_bayes">Char-Ngram 朴素贝叶斯 (从 Train 学习)</option>
              <option value="keyword_baseline">静态关键词规则基线 (不学习)</option>
            </select>
            <small>支持新旧算法纵向对比</small>
          </label>
          <label class="field" id="ngramField">
            <span>N-gram 最大长度</span>
            <select id="ngramSelect">
              <option value="1">1-gram (单字特征)</option>
              <option value="2" selected>1~2-gram (单字+双字词组)</option>
              <option value="3">1~3-gram (含三字短语)</option>
            </select>
            <small>决定词组特征粒度</small>
          </label>
          <label class="field" id="alphaField">
            <span>平滑系数 Alpha：<strong id="alphaValLabel">1.0</strong></span>
            <input type="range" id="alphaSlider" min="0.1" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('alphaValLabel').textContent=this.value" />
            <small>越小越贴合训练集，越大抗噪越强</small>
          </label>
          <label class="field">
            <span>评测目标数据集</span>
            <select id="evalSplitSelect">
              <option value="test" selected>Test 测试集 (最终盲测)</option>
              <option value="val">Val 验证集 (调参验证)</option>
            </select>
            <small>调参阶段建议先看 Val 集</small>
          </label>
        </div>
        <div class="row">
          <button class="primary" onclick="runExperiment()">开始清洗均衡、训练并评测</button>
          <span id="runStatus" class="meta" style="margin:0;"></span>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3 style="margin-top:0;">三、最新均衡数据集分布</h3>
          <div id="distBars"></div>
        </div>
        <div class="card">
          <h3 style="margin-top:0;">四、最新评测指标与各类别召回率</h3>
          <div class="kpi-grid" id="evalKpis"></div>
          <div id="recallBars"></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">五、最新评测混淆矩阵 (行=真实类别, 列=预测类别)</h3>
        <div id="confusionMatrixBox"></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">六、多版本实验历史对比 (高亮最优 Macro-F1)</h3>
        <table>
          <thead>
            <tr>
              <th>模型与策略</th>
              <th>Seed</th>
              <th>切分</th>
              <th>评测集</th>
              <th>样本数</th>
              <th>Accuracy</th>
              <th>Macro-F1</th>
              <th>RAG Hit@3</th>
            </tr>
          </thead>
          <tbody id="jobsBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. 人工客服接管台 -->
    <section id="tab-handoff" class="panel">
      <div class="card">
        <h3 style="margin-top:0;">待处理与已认领转人工工单</h3>
        <table>
          <thead>
            <tr>
              <th>工单 ID</th>
              <th>会话 ID</th>
              <th>触发原因</th>
              <th>摘要</th>
              <th>状态</th>
              <th>人工回复操作</th>
            </tr>
          </thead>
          <tbody id="ticketsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let currentSessionId = "demo-session-" + Date.now();

    function switchTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      refreshOverview();
    }

    function toggleNbParams() {
      const isNb = document.getElementById("classifierSelect").value === "naive_bayes";
      document.getElementById("ngramField").style.opacity = isNb ? "1" : "0.45";
      document.getElementById("alphaField").style.opacity = isNb ? "1" : "0.45";
    }

    function quickAsk(text) {
      document.getElementById("chatInput").value = text;
      sendMessage();
    }

    function newSession() {
      currentSessionId = "demo-session-" + Date.now();
      loadMessages();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const content = input.value.trim();
      if (!content) return;
      input.value = "";

      await fetch("/api/chat/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: currentSessionId, content })
      });
      await loadMessages();
      await refreshOverview();
    }

    async function loadMessages() {
      const res = await fetch("/api/chat/messages?sessionId=" + encodeURIComponent(currentSessionId));
      const data = await res.json();
      const box = document.getElementById("chatBox");
      box.innerHTML = "";
      for (const m of data.messages) {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        let meta = "";
        if (m.confidence !== undefined) meta += `置信度: ${m.confidence}`;
        if (m.citations && m.citations.length > 0) meta += ` | 引用命中 ${m.citations.length} 条`;

        let extraHtml = "";
        if (m.role === "assistant") {
          const upStyle = m.feedback === "helpful" ? "background:#ecfdf5;border-color:#059669;" : "";
          const downStyle = m.feedback === "unhelpful" ? "background:#fef2f2;border-color:#dc2626;" : "";
          extraHtml += `<div class="row" style="margin-top:6px;">
            <button class="ghost" style="padding:2px 8px;font-size:12px;${upStyle}" onclick="submitFeedback('${m.id}', 'helpful')">👍 有帮助</button>
            <button class="ghost" style="padding:2px 8px;font-size:12px;${downStyle}" onclick="submitFeedback('${m.id}', 'unhelpful')">👎 没帮助</button>
          </div>`;
          if (m.citations && m.citations.length > 0) {
            extraHtml += `<details style="margin-top:6px;font-size:12px;color:var(--muted);">
              <summary style="cursor:pointer;">查看引用原文 (${m.citations.length})</summary>
              ${m.citations.map((c, idx) => `<div style="margin-top:4px;padding:6px;background:#f9fafb;border-radius:4px;">[${idx + 1}] 相似度 ${c.score}：${escapeHtml(c.snippet)}</div>`).join("")}
            </details>`;
          }
        }

        div.innerHTML = `<div>${escapeHtml(m.content)}</div>` + (meta ? `<div class="meta">${meta}</div>` : "") + extraHtml;
        box.appendChild(div);
      }
      box.scrollTop = box.scrollHeight;
    }

    async function uploadCorpus() {
      const fileInput = document.getElementById("corpusFileInput");
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        document.getElementById("uploadMsg").textContent = "请先选择一个 .jsonl 或 .csv 文件。";
        return;
      }
      const content = await file.text();
      const res = await fetch("/api/corpus/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, content })
      });
      const data = await res.json();
      document.getElementById("uploadMsg").textContent = data.error
        ? `导入失败: ${data.error}`
        : `已导入 ${file.name}（解析 ${data.recordCount} 条${data.deduplicated ? "，已存在去重" : ""}），点击“开始清洗均衡、训练并评测”即可生效。`;
      await refreshOverview();
    }

    async function runExperiment() {
      document.getElementById("runStatus").textContent = "正在运行清洗、训练与评测...";
      const version = document.getElementById("verInput").value.trim();
      const seed = Number(document.getElementById("seedInput").value || 42);
      const balanceStrategy = document.getElementById("strategySelect").value;
      const [train, val, test] = document.getElementById("splitPresetSelect").value.split(",").map(Number);
      const classifierType = document.getElementById("classifierSelect").value;
      const ngramMax = Number(document.getElementById("ngramSelect").value);
      const alpha = Number(document.getElementById("alphaSlider").value);
      const evalSplit = document.getElementById("evalSplitSelect").value;

      await fetch("/api/pipeline/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          version,
          seed,
          balanceStrategy,
          splitRatio: { train, val, test },
          classifierType,
          ngramMax,
          alpha,
          evalSplit
        })
      });
      document.getElementById("runStatus").textContent = "实验完成，已更新下方对比结果。";
      await refreshOverview();
    }

    async function submitFeedback(messageId, feedback) {
      await fetch("/api/chat/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageId, feedback })
      });
      await loadMessages();
    }

    async function promoteQa(ticketId) {
      const res = await fetch("/api/handoff/promote-qa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticketId })
      });
      const data = await res.json();
      alert(data.ok ? `已收录为【${data.category}】标准 QA 样本！前往工作台重新运行训练即可生效。` : `收录失败: ${data.error}`);
      await refreshOverview();
    }

    async function replyTicket(ticketId) {
      const input = document.getElementById("reply-" + ticketId);
      const replyContent = input.value.trim();
      if (!replyContent) return;
      await fetch("/api/handoff/reply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticketId, replyContent })
      });
      await refreshOverview();
      await loadMessages();
    }

    async function refreshOverview() {
      const res = await fetch("/api/overview");
      const data = await res.json();
      document.getElementById("modeBadge").textContent = "运行模式: " + data.mode;
      document.getElementById("corpusSummary").textContent = `已接入语料文件数: ${data.documents.length} | 数据集版本数: ${data.datasetVersions.length}`;

      const latestVer = data.datasetVersions[0];
      const distBox = document.getElementById("distBars");
      if (latestVer) {
        const dist = latestVer.classDistribution;
        const maxVal = Math.max(1, ...Object.values(dist));
        distBox.innerHTML = `<div class="meta" style="margin-bottom:8px;">版本 ${latestVer.version} | 策略: ${latestVer.balanceStrategy} | Seed: ${latestVer.seed} | 均衡总样本: ${latestVer.totalCount}</div>` +
          Object.entries(dist).map(([k, v]) => `
            <div class="bar-row">
              <span class="bar-label">${k}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(v / maxVal) * 100}%"></div></div>
              <span>${v}</span>
            </div>
          `).join("");
      }

      const evalJobs = data.trainingJobs.filter(j => j.jobType === "intent_eval");
      const latestEval = evalJobs[0];
      if (latestEval && latestEval.metrics) {
        const m = latestEval.metrics;
        document.getElementById("evalKpis").innerHTML = `
          <div class="kpi-box"><div class="kpi-label">Accuracy</div><div class="kpi-val">${(m.accuracy * 100).toFixed(1)}%</div></div>
          <div class="kpi-box"><div class="kpi-label">Macro-F1</div><div class="kpi-val">${(m.macroF1 * 100).toFixed(1)}%</div></div>
          <div class="kpi-box"><div class="kpi-label">RAG Hit@3</div><div class="kpi-val">${m.ragHitAt3 !== undefined ? (m.ragHitAt3 * 100).toFixed(1) + "%" : "-"}</div></div>
          <div class="kpi-box"><div class="kpi-label">评测样本数</div><div class="kpi-val">${m.evaluatedCount}</div></div>
        `;
        document.getElementById("recallBars").innerHTML = Object.entries(m.perClassRecall || {}).map(([k, v]) => `
          <div class="bar-row">
            <span class="bar-label">${k}</span>
            <div class="bar-track"><div class="bar-fill ok" style="width:${v * 100}%"></div></div>
            <span>${(v * 100).toFixed(1)}%</span>
          </div>
        `).join("");

        if (m.confusionMatrix) {
          const cats = ["consultation", "logistics", "refund", "complaint"];
          document.getElementById("confusionMatrixBox").innerHTML = `
            <table>
              <thead><tr><th>真实 \\ 预测</th>${cats.map(c => `<th class="cm-cell">${c}</th>`).join("")}</tr></thead>
              <tbody>
                ${cats.map(rowCat => `
                  <tr>
                    <td><strong>${rowCat}</strong></td>
                    ${cats.map(colCat => `<td class="cm-cell ${rowCat === colCat ? "cm-diag" : ""}">${m.confusionMatrix[rowCat]?.[colCat] ?? 0}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        }
      }

      const bestF1 = Math.max(0, ...evalJobs.map(j => j.metrics?.macroF1 ?? 0));
      document.getElementById("jobsBody").innerHTML = evalJobs.map(j => {
        const hp = j.hyperparams || {};
        const splitStr = hp.trainRatio ? `${hp.trainRatio}/${hp.valRatio}/${hp.testRatio}` : "-";
        const isBest = j.metrics && j.metrics.macroF1 === bestF1 && bestF1 > 0;
        return `
          <tr class="${isBest ? "best-row" : ""}">
            <td>${j.targetModel} (${hp.balanceStrategy || "-"})</td>
            <td>${j.seed}</td>
            <td>${splitStr}</td>
            <td>${hp.evalSplit || "test"}</td>
            <td>${j.sampleCount}</td>
            <td>${j.metrics ? (j.metrics.accuracy * 100).toFixed(1) + "%" : "-"}</td>
            <td><strong>${j.metrics ? (j.metrics.macroF1 * 100).toFixed(1) + "%" : "-"}</strong></td>
            <td>${j.metrics && j.metrics.ragHitAt3 !== undefined ? (j.metrics.ragHitAt3 * 100).toFixed(1) + "%" : "-"}</td>
          </tr>
        `;
      }).join("");

      document.getElementById("ticketsBody").innerHTML = data.tickets.map(t => `
        <tr>
          <td>${t.id.slice(0, 8)}</td>
          <td>${t.sessionId}</td>
          <td>${t.reason}</td>
          <td>${escapeHtml(t.summary)}</td>
          <td>${t.status}</td>
          <td>
            <div class="row">
              <input type="text" id="reply-${t.id}" placeholder="输入人工回复..." style="min-width:140px;" />
              <button class="primary" onclick="replyTicket('${t.id}')">认领并回复</button>
              ${t.status === "claimed" ? `<button class="ghost" onclick="promoteQa('${t.id}')">收录为 QA 样本</button>` : ""}
            </div>
          </td>
        </tr>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
    }

    refreshOverview();
    loadMessages();
  </script>
</body>
</html>
