services:
  qa-web:
    build: .
    container_name: training-service-system-demo
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - USE_OLLAMA=${USE_OLLAMA:-0}
      - OLLAMA_EMBED=${OLLAMA_EMBED:-0}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
